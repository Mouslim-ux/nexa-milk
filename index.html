<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA MILK</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a2351"><link rel="icon" href="icon-192.png">
<style>
:root{--d:#0a2351;--m:#1e63d6;--l:#4aa3ff;--bg:#f2f6fc;--g:#16a34a;--r:#dc2626}

main{padding:14px}h2{margin:6px 0 12px}h3{margin:16px 0 8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.b{background:linear-gradient(135deg,var(--m),var(--l));color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;margin:4px 0}
.b.o{background:#fff;color:var(--m);border:1px solid var(--m)}
input,select{width:100%;padding:10px;border:1px solid #c9d6ec;border-radius:10px;font-size:15px;margin:4px 0;background:#fff;color:var(--d)}
label{font-size:13px;color:#5b6b8c}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}a{color:var(--m);font-weight:700;cursor:pointer}
.rd{color:var(--r)}.gn{color:var(--g)}
.tw{overflow-x:auto;background:#fff;border-radius:12px;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--d);color:#fff;padding:8px;white-space:nowrap}td{padding:8px;border-bottom:1px solid #e3ebf7;white-space:nowrap;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;box-shadow:0 -4px 16px #0a235122;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:#5b6b8c}nav a span{display:block;font-size:22px}nav a.on{color:var(--m);border-top:3px solid var(--m)}
.mo{position:fixed;inset:0;background:#0a235199;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:4px;align-items:center}.ln input,.ln select{padding:8px 4px;font-size:13px}
.ts{position:fixed;top:70px;left:10px;right:10px;background:var(--d);color:#fff;padding:12px;border-radius:12px;z-index:50;text-align:center}
.lg{max-width:360px;margin:12vh auto;padding:24px;text-align:center}.lg h1{color:var(--d)}
.bar{display:flex;align-items:flex-end;gap:6px;height:110px;background:#fff;border-radius:14px;padding:10px}.bar div{flex:1;background:linear-gradient(var(--l),var(--m));border-radius:6px 6px 0 0;min-height:2px}
.bar+.bar{height:auto;padding:0 10px;font-size:11px;text-align:center}.bar+.bar span{flex:1}
@media print{body *{visibility:hidden}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== ضع بيانات مشروعك في Supabase هنا (Project Settings > API) =====
const SB_URL='https://prxrjlhewnekbugpfdlu.supabase.co',SB_KEY='sb_publishable_jOSds1-ofYCbLrtyIvzHqg_0g36-cdu';
const sb=supabase.createClient(SB_URL,SB_KEY);
const T=['suppliers','products','purchases','purchase_items','shops','sales','sale_items','payments','expenses','worker_days','stock_adj'];
let S={},page='home',per='month',q='';
const $=s=>document.querySelector(s),app=$('#app');
const n=v=>+v||0,f=v=>n(v).toLocaleString('en',{maximumFractionDigits:2}),sum=(a,k)=>a.reduce((t,x)=>t+n(x[k]),0);
const today=()=>new Date().toISOString().slice(0,10),opts=(a,fn)=>a.map(fn).join('');
const act=t=>S[t].filter(x=>x.active!==false),P=id=>S.products.find(x=>x.id==id)||{},nm=(t,id)=>(S[t].find(x=>x.id==id)||{}).name||'';
const el=h=>{const m=document.createElement('div');m.className='mo';m.innerHTML=h;document.body.append(m);return m};
function toast(t){const d=document.createElement('div');d.className='ts';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),4000)}
const tbl=(h,r)=>`<div class=tw><table><tr>${opts(h,x=>`<th>${x}</th>`)}</tr>${r.length?opts(r,x=>`<tr>${opts(x,c=>`<td>${c??''}</td>`)}</tr>`):`<tr><td colspan=${h.length}>لا توجد بيانات بعد</td></tr>`}</table></div>`;
// ===== المخزون والحسابات =====
const stock=id=>sum(S.purchase_items.filter(x=>x.product_id==id),'qty')-sum(S.sale_items.filter(x=>x.product_id==id),'qty')+sum(S.stock_adj.filter(x=>x.product_id==id),'qty');
function avg(id){const i=S.purchase_items.filter(x=>x.product_id==id),q=sum(i,'qty');return q?i.reduce((a,x)=>a+n(x.qty)*n(x.price),0)/q:n(P(id).buy_price)}
function fq(id,q){const p=P(id),k=n(p.pack_size)||1;q=n(q);return k>1?`${Math.trunc(q/k)} صندوق + ${q%k} ${p.unit}`:`${q} ${p.unit}`}
const debt=(t,id)=>{const sh=t=='shops',d=S[sh?'sales':'purchases'].filter(x=>x[sh?'shop_id':'supplier_id']==id);return sum(d,'total')-sum(d,'paid')-sum(S.payments.filter(p=>p.party_id==id),'amount')};
function since(p){const d=new Date();if(p=='day')return today();if(p=='week')d.setDate(d.getDate()-6);else if(p=='month')d.setDate(1);else if(p=='year')d.setMonth(0,1);else return '0000';return d.toISOString().slice(0,10)}
// ===== قاعدة البيانات =====
async function load(){for(const t of T){const{data,error}=await sb.from(t).select('*').order('created_at');if(error){toast(error.message);S[t]=S[t]||[]}else S[t]=data}}
async function ins(t,row){const{data,error}=await sb.from(t).insert(row).select().single();if(error){toast(error.message);throw error}return data}
// ===== نماذج عامة =====
const CFG={
products:{l:'منتج',f:()=>[['name','اسم المنتج'],['supplier_id','المصنع','sel',[['','—'],...act('suppliers').map(x=>[x.id,x.name])]],['unit','وحدة القياس (كيس، علبة...)'],['pack_size','عدد الوحدات في الصندوق (1 إن لم يوجد صندوق)','number'],['buy_price','سعر الشراء للوحدة','number'],['sell_price','سعر البيع للوحدة','number']],d:{unit:'كيس',pack_size:1}},
suppliers:{l:'مصنع',f:()=>[['name','اسم المصنع'],['phone','الهاتف']]},
shops:{l:'محل',f:()=>[['name','اسم المحل'],['owner','اسم المالك'],['phone','الهاتف'],['address','العنوان']]},
expenses:{l:'مصروف',f:()=>[['date','التاريخ','date'],['type','النوع','sel',['وقود','صيانة الشاحنة','مصاريف التحميل','أخرى'].map(x=>[x,x])],['amount','المبلغ','number'],['note','الوصف']],d:{date:today()}},
worker_days:{l:'يوم عمل',f:()=>[['worker','اسم الحمال'],['date','التاريخ','date'],['wage','الأجرة اليومية','number'],['paid','المبلغ المدفوع','number'],['note','ملاحظة']],d:{date:today()}},
stock_adj:{l:'تسوية مخزون',f:()=>[['product_id','المنتج','sel',act('products').map(x=>[x.id,x.name])],['date','التاريخ','date'],['qty','الكمية بالوحدات (سالب للتالف/المفقود)','number'],['note','السبب']],d:{date:today()}}};
function modal(title,fields,vals,save){
const m=el(`<div class=md><h3>${title}</h3>${opts(fields,([k,l,t,o])=>`<label>${l}</label>`+(t=='sel'?`<select id=f_${k}>${opts(o,([v,x])=>`<option value="${v}">${x}</option>`)}</select>`:`<input id=f_${k} type=${t||'text'} step=any>`))}<div class=row><button class=b id=ok>حفظ</button><button class="b o" id=no>إلغاء</button></div></div>`);
fields.forEach(([k])=>{const e=m.querySelector('#f_'+k);if(vals&&vals[k]!=null)e.value=vals[k]});
m.querySelector('#no').onclick=()=>m.remove();
m.querySelector('#ok').onclick=async e=>{const o={};fields.forEach(([k,,t])=>{const v=m.querySelector('#f_'+k).value;o[k]=t=='number'?n(v):v||null});
if('name'in o&&!o.name)return toast('الاسم مطلوب');if('worker'in o&&!o.worker)return toast('اسم الحمال مطلوب');
e.target.disabled=true;try{await save(o);m.remove();await load();render()}catch(x){e.target.disabled=false}}}
const add=t=>{const c=CFG[t];if(t=='stock_adj'&&!act('products').length)return toast('أضف منتجاً أولاً');modal('إضافة '+c.l,c.f(),c.d,o=>ins(t,o))};
const edit=(t,id)=>{const c=CFG[t];modal('تعديل '+c.l,c.f(),S[t].find(x=>x.id==id),async o=>{const{error}=await sb.from(t).update(o).eq('id',id);if(error){toast(error.message);throw error}})};
async function rm(t,id){if(!confirm('تأكيد الحذف؟'))return;const soft=['products','suppliers','shops'].includes(t);const{error}=await(soft?sb.from(t).update({active:false}):sb.from(t).delete()).eq('id',id);if(error)return toast(error.message);await load();render()}
const pay=(t,id)=>modal(t=='shops'?'تحصيل من '+nm(t,id):'دفع إلى '+nm(t,id),[['date','التاريخ','date'],['amount','المبلغ','number'],['note','ملاحظة']],{date:today()},o=>{if(o.amount<=0){toast('أدخل مبلغاً صحيحاً');throw 0}return ins('payments',{...o,kind:t,party_id:id})});
function stmt(t,id){const sh=t=='shops';let r=[];S[sh?'sales':'purchases'].filter(x=>x[sh?'shop_id':'supplier_id']==id).forEach(x=>r.push([x.date,'فاتورة',n(x.total),n(x.paid)]));S.payments.filter(p=>p.party_id==id).forEach(p=>r.push([p.date,sh?'تحصيل':'دفعة',0,n(p.amount)]));r.sort((a,b)=>a[0]<b[0]?-1:1);let b=0;
el(`<div class=md><h3>كشف حساب: ${nm(t,id)}</h3>${tbl(['التاريخ','العملية','الفاتورة','المدفوع','الرصيد'],r.map(x=>{b+=x[2]-x[3];return[x[0],x[1],f(x[2]),f(x[3]),f(b)]}))}<button class="b o" onclick="this.closest('.mo').remove()">إغلاق</button></div>`)}
// ===== فواتير البيع والشراء (عدة منتجات) =====
function docForm(k){const buy=k=='buy',pts=act(buy?'suppliers':'shops'),pr=act('products');
if(!pts.length||!pr.length)return toast(buy?'أضف مصنعاً ومنتجاً أولاً':'أضف محلاً ومنتجاً أولاً');
const m=el(`<div class=md><h3>${buy?'فاتورة شراء':'فاتورة بيع'}</h3><label>${buy?'المصنع':'المحل'}</label><select id=pt>${opts(pts,x=>`<option value=${x.id}>${x.name}</option>`)}</select><label>التاريخ</label><input id=dt type=date value=${today()}><div id=ls></div><button class="b o" id=ad>+ منتج</button><h3 id=tt></h3><label>المبلغ المدفوع</label><input id=pd type=number step=any value=0><div class=row><button class=b id=ok>حفظ الفاتورة</button><button class="b o" id=no>إلغاء</button></div></div>`);
const ls=m.querySelector('#ls'),rd=()=>[...ls.querySelectorAll('.ln')].map(d=>{const p=P(d.querySelector('.p').value),u=d.querySelector('.u').value=='k'?(n(p.pack_size)||1):1;return{product_id:p.id,qty:n(d.querySelector('.q').value)*u,price:n(d.querySelector('.pr').value)}}).filter(x=>x.qty>0);
const calc=()=>m.querySelector('#tt').textContent='الإجمالي: '+f(rd().reduce((a,x)=>a+x.qty*x.price,0));
const line=()=>{const d=document.createElement('div');d.className='ln';d.innerHTML=`<select class=p>${opts(pr,x=>`<option value=${x.id}>${x.name}</option>`)}</select><input class=q type=number step=any placeholder="الكمية"><select class=u><option value=1>وحدة</option><option value=k>صندوق</option></select><input class=pr type=number step=any placeholder="سعر الوحدة"><a>✕</a>`;
const setp=()=>{d.querySelector('.pr').value=n(P(d.querySelector('.p').value)[buy?'buy_price':'sell_price'])||''};setp();
d.querySelector('.p').onchange=()=>{setp();calc()};d.oninput=calc;d.querySelector('a').onclick=()=>{d.remove();calc()};ls.append(d)};
line();m.querySelector('#ad').onclick=line;m.querySelector('#no').onclick=()=>m.remove();
m.querySelector('#ok').onclick=async e=>{const L=rd();if(!L.length)return toast('أضف منتجاً وكمية');
if(!buy){const need={};L.forEach(x=>need[x.product_id]=(need[x.product_id]||0)+x.qty);for(const id in need)if(need[id]>stock(id))return toast(`المخزون لا يكفي لـ ${P(id).name}. المتوفر ${fq(id,stock(id))}. سجّل تسوية مخزون أولاً`)}
const total=L.reduce((a,x)=>a+x.qty*x.price,0),paid=n(m.querySelector('#pd').value);if(paid>total)return toast('المبلغ المدفوع أكبر من إجمالي الفاتورة');
e.target.disabled=true;let h;try{h=await ins(buy?'purchases':'sales',{[buy?'supplier_id':'shop_id']:m.querySelector('#pt').value,date:m.querySelector('#dt').value,total,paid});
const{error}=await sb.from(buy?'purchase_items':'sale_items').insert(L.map(x=>({[buy?'purchase_id':'sale_id']:h.id,product_id:x.product_id,qty:x.qty,price:x.price,...(buy?{}:{cost:avg(x.product_id)})})));
if(error){await sb.from(buy?'purchases':'sales').delete().eq('id',h.id);throw error}
m.remove();await load();render();toast('تم حفظ الفاتورة')}catch(x){if(x&&x.message)toast(x.message);e.target.disabled=false}}}
function printInv(id){const s=S.sales.find(x=>x.id==id),it=S.sale_items.filter(x=>x.sale_id==id),w=open('','_blank');
w.document.write(`<html dir=rtl><body style="font-family:Tahoma;padding:20px"><h2>NEXA MILK</h2><p>المحل: ${nm('shops',s.shop_id)} — التاريخ: ${s.date}</p><table border=1 cellpadding=6 style="border-collapse:collapse;width:100%"><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>المجموع</th></tr>${opts(it,x=>`<tr><td>${P(x.product_id).name}</td><td>${fq(x.product_id,x.qty)}</td><td>${f(x.price)}</td><td>${f(x.qty*x.price)}</td></tr>`)}</table><h3>الإجمالي ${f(s.total)} | المدفوع ${f(s.paid)} | المتبقي ${f(s.total-s.paid)}</h3></body></html>`);w.document.close();w.print()}
// ===== الصفحات =====
function home(){const s=since(per),inP=x=>x.date>=s,sales=S.sales.filter(inP),ids=new Set(sales.map(x=>x.id)),items=S.sale_items.filter(x=>ids.has(x.sale_id));
const rev=sum(sales,'total'),cogs=items.reduce((a,x)=>a+n(x.qty)*n(x.cost),0),gross=rev-cogs,ex=sum(S.expenses.filter(inP),'amount'),wg=sum(S.worker_days.filter(inP),'wage'),net=gross-ex-wg;
const val=act('products').reduce((a,p)=>a+Math.max(0,stock(p.id))*avg(p.id),0);
const C=[['💰','إجمالي المبيعات',f(rev)],['🚚','إجمالي المشتريات',f(sum(S.purchases.filter(inP),'total'))],['📈','الربح الإجمالي',f(gross)],['🧾','المصاريف التشغيلية',f(ex+wg)],['✅','صافي الربح',`<span class=${net<0?'rd':'gn'}>${f(net)}</span>`],['📦','قيمة المخزون',f(val)],['🏪','ديون المحلات',`<span class=rd>${f(act('shops').reduce((a,x)=>a+debt('shops',x.id),0))}</span>`],['🏭','ديون المصانع',`<span class=rd>${f(act('suppliers').reduce((a,x)=>a+debt('suppliers',x.id),0))}</span>`],['👥','عدد المحلات',act('shops').length],['🥛','عدد المنتجات',act('products').length]];
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),dv=days.map(d=>sum(S.sales.filter(x=>x.date==d),'total')),mx=Math.max(...dv,1);
const pp={};items.forEach(x=>{pp[x.product_id]=(pp[x.product_id]||0)+n(x.qty)*(n(x.price)-n(x.cost))});const sp={};Object.keys(pp).forEach(id=>{const k=P(id).supplier_id;sp[k]=(sp[k]||0)+pp[id]});
return `<h2>لوحة التحكم</h2><select onchange="per=this.value;render()">${opts([['day','اليوم'],['week','آخر 7 أيام'],['month','هذا الشهر'],['year','هذه السنة'],['all','الكل']],([v,x])=>`<option value=${v} ${v==per?'selected':''}>${x}</option>`)}</select><div class=g>${opts(C,c=>`<div class=s><small>${c[0]} ${c[1]}</small><div>${c[2]}</div></div>`)}</div><h3>مبيعات آخر 7 أيام</h3><div class=bar>${opts(dv,v=>`<div style="height:${v/mx*100}%"></div>`)}</div><div class=bar>${opts(days,d=>`<span>${d.slice(8)}</span>`)}</div><h3>ربح كل منتج</h3>${tbl(['المنتج','الربح'],Object.keys(pp).map(id=>[P(id).name,f(pp[id])]))}<h3>ربح كل مصنع</h3>${tbl(['المصنع','الربح'],Object.keys(sp).map(id=>[nm('suppliers',id)||'بدون مصنع',f(sp[id])]))}<p style="color:#5b6b8c;font-size:13px">الربح الإجمالي = المبيعات − تكلفة البضاعة المباعة. صافي الربح = الربح الإجمالي − المصاريف − أجور الحمال.</p>`}
function docPage(k){const buy=k=='purchases',fk=buy?'supplier_id':'shop_id',pt=buy?'suppliers':'shops';
return `<h2>${buy?'المشتريات':'المبيعات'}</h2><button class=b onclick="docForm('${buy?'buy':'sell'}')">+ فاتورة جديدة</button>`+tbl(['التاريخ',buy?'المصنع':'المحل','الإجمالي','المدفوع','المتبقي',''],[...S[k]].reverse().map(x=>[x.date,nm(pt,x[fk]),f(x.total),f(x.paid),f(x.total-x.paid),(buy?'':`<a onclick="printInv('${x.id}')">🖨</a> `)+`<a onclick="rm('${k}','${x.id}')">🗑</a>`]))}
function parties(t){const sh=t=='shops',tot=x=>sum(S.sales.filter(s=>s.shop_id==x.id),'total');let a=act(t).filter(x=>((x.name||'')+(x.owner||'')+(x.phone||'')).includes(q));if(sh)a.sort((u,v)=>tot(v)-tot(u));
return `<h2>${sh?'المحلات':'المصانع'}</h2><button class=b onclick="add('${t}')">+ إضافة</button><input placeholder="بحث ثم اضغط Enter" onchange="q=this.value;render()" value="${q}">`+opts(a,x=>`<div class=c2><b>${x.name}</b> ${x.owner||''} ${x.phone||''}<br>${sh?'إجمالي الفواتير: '+f(tot(x))+' | ':''}الدين: <b class=${debt(t,x.id)>0?'rd':''}>${f(debt(t,x.id))}</b><div class=row><a onclick="stmt('${t}','${x.id}')">كشف الحساب</a><a onclick="pay('${t}','${x.id}')">${sh?'تحصيل':'دفع'}</a><a onclick="edit('${t}','${x.id}')">تعديل</a><a onclick="rm('${t}','${x.id}')">حذف</a></div></div>`)}
const products=()=>`<h2>المنتجات</h2><button class=b onclick="add('products')">+ منتج جديد</button>`+tbl(['المنتج','المصنع','شراء','بيع','المخزون',''],act('products').map(p=>[p.name,nm('suppliers',p.supplier_id),f(p.buy_price),f(p.sell_price),fq(p.id,stock(p.id)),`<a onclick="edit('products','${p.id}')">✏️</a> <a onclick="rm('products','${p.id}')">🗑</a>`]));
const stockPg=()=>`<h2>المخزون (الشاحنة)</h2><button class=b onclick="add('stock_adj')">تسوية / تالف / مفقود</button>`+tbl(['المنتج','المتوفر','القيمة'],act('products').map(p=>[p.name,fq(p.id,stock(p.id)),f(stock(p.id)*avg(p.id))]))+`<h3>سجل التسويات</h3>`+tbl(['التاريخ','المنتج','الكمية','السبب',''],S.stock_adj.map(a=>[a.date,P(a.product_id).name,a.qty,a.note,`<a onclick="rm('stock_adj','${a.id}')">🗑</a>`]));
const expenses=()=>`<h2>المصاريف</h2><button class=b onclick="add('expenses')">+ مصروف</button><p style="font-size:13px;color:#5b6b8c">أجور الحمال تُسجَّل من قسم «الحمال» فقط ولا تُكرَّر هنا.</p><div class=s><small>مجموع المصاريف</small><div>${f(sum(S.expenses,'amount'))}</div></div>`+tbl(['التاريخ','النوع','المبلغ','الوصف',''],[...S.expenses].reverse().map(x=>[x.date,x.type,f(x.amount),x.note,`<a onclick="edit('expenses','${x.id}')">✏️</a> <a onclick="rm('expenses','${x.id}')">🗑</a>`]));
const workers=()=>{const w=S.worker_days,m=today().slice(0,7);return `<h2>أجور الحمال</h2><button class=b onclick="add('worker_days')">+ يوم عمل</button><p style="font-size:13px;color:#5b6b8c">سجّل أيام العمل الفعلية فقط. أيام الراحة لا تُسجَّل ولا تُحتسب.</p><div class=g><div class=s><small>أجور هذا الشهر</small><div>${f(sum(w.filter(x=>x.date.startsWith(m)),'wage'))}</div></div><div class=s><small>إجمالي الأجور</small><div>${f(sum(w,'wage'))}</div></div><div class=s><small>المدفوع</small><div>${f(sum(w,'paid'))}</div></div><div class=s><small>المتبقي</small><div class=rd>${f(sum(w,'wage')-sum(w,'paid'))}</div></div></div>`+tbl(['الحمال','التاريخ','الأجرة','المدفوع','المتبقي',''],[...w].reverse().map(x=>[x.worker,x.date,f(x.wage),f(x.paid),f(x.wage-x.paid),`<a onclick="edit('worker_days','${x.id}')">✏️</a> <a onclick="rm('worker_days','${x.id}')">🗑</a>`]))};
const more=()=>`<h2>المزيد</h2><div class=g>${opts([['products','🥛','المنتجات'],['suppliers','🏭','المصانع'],['shops','🏪','المحلات'],['expenses','⛽','المصاريف'],['workers','👷','الحمال']],x=>`<div class=s onclick="go('${x[0]}')" style="text-align:center"><div>${x[1]}</div><small>${x[2]}</small></div>`)}</div>`;
const NAV=[['home','🏠','الرئيسية'],['sales','🧾','المبيعات'],['purchases','🚚','المشتريات'],['stock','📦','المخزون'],['more','☰','المزيد']];
const go=p=>{page=p;q='';render();scrollTo(0,0)};
function render(){const V={home,sales:()=>docPage('sales'),purchases:()=>docPage('purchases'),stock:stockPg,products,suppliers:()=>parties('suppliers'),shops:()=>parties('shops'),expenses,workers,more},top=NAV.some(x=>x[0]==page);
app.innerHTML=`<header><b>💧 NEXA MILK</b><button onclick="sb.auth.signOut().then(loginUI)">خروج</button></header><main>${top?'':`<a onclick="go('more')">→ رجوع</a>`}${V[page]()}</main><nav>${opts(NAV,x=>`<a class="${x[0]==page||(!top&&x[0]=='more')?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</a>`)}</nav>`}
// ===== الدخول والتشغيل =====
function loginUI(){app.innerHTML=`<div class=lg><h1>💧 NEXA MILK</h1><input id=em type=email placeholder="البريد الإلكتروني"><input id=pw type=password placeholder="كلمة المرور"><button class=b id=li style="width:100%">دخول</button></div>`;
$('#li').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?toast('بيانات الدخول غير صحيحة'):start()}}
async function start(){app.innerHTML='<p style="text-align:center;margin-top:40vh">جاري التحميل...</p>';await load();
if(!S.products.length&&!S.suppliers.length){try{await sb.from('products').insert([{name:'الحليب',unit:'كيس',pack_size:12},{name:'اللبن',unit:'وحدة'},{name:'الإكريمي',unit:'وحدة'},{name:'الشربات',unit:'وحدة'},{name:'الزبدة',unit:'وحدة'}]);await load()}catch(e){}}
render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
sb.auth.getSession().then(({data})=>data.session?start():loginUI());
</script></body></html>
